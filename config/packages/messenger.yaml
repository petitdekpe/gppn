framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            # File dédiée aux conversions WebM : un encodage peut durer
            # plusieurs minutes et ne doit pas retarder les e-mails (OTP…) de
            # la file async. Worker : messenger:consume transcode
            transcode:
                dsn: '%env(MESSENGER_TRANSCODE_DSN)%'
                # Les échecs ffmpeg sont gérés par le handler (statut « échec ») ;
                # relancer un encodage de plusieurs minutes n'aurait pas de sens.
                retry_strategy:
                    max_retries: 0
            failed: 'doctrine://default?queue_name=failed'
            # sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            Symfony\Component\Mailer\Messenger\SendEmailMessage: async
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async
            App\Message\TranscodeToWebm: transcode
            # Une seconde de travail : pas derrière les encodages WebM de plusieurs minutes.
            App\Message\GenerateVideoCover: async

when@prod:
    framework:
        messenger:
            transports:
                # Driver Doctrine en dev (voir .env), Redis en prod pour ne pas
                # dépendre de la base applicative.
                async:
                    dsn: '%env(REDIS_MESSENGER_DSN)%'
                transcode:
                    dsn: '%env(REDIS_TRANSCODE_DSN)%'
